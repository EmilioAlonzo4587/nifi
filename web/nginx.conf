server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;  # DNS interno de Docker

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";  # que el navegador siempre cargue la última versión
    }

    # El CSV subido se reenvía al procesador ListenHTTP de NiFi
    location /subir {
        set $nifi http://nifi:9090;
        proxy_pass $nifi;
        client_max_body_size 10m;
    }

    # Lectura de la tabla clientes a través de PostgREST
    location /api/ {
        set $api http://postgrest:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }
}
